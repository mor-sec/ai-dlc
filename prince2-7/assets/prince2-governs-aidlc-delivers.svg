<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>PRINCE2 governs, AI-DLC delivers</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .t{fill:#0f172a}.m{fill:#475569}.w{fill:#fff}
    .h1{font-size:30px;font-weight:700}.h2{font-size:17px;font-weight:700}
    .b{font-size:14px}.s{font-size:12.5px}.lbl{font-size:13px;font-weight:700;letter-spacing:.06em}
  </style>

  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="52" class="t h1">PRINCE2 governs <tspan fill="#94a3b8">·</tspan> <tspan fill="#c2410c">AI-DLC delivers</tspan></text>
  <text x="40" y="78" class="m b">PRINCE2 7 decides whether, when and within what limits. AWS AI-DLC decides how the products get built.</text>

  <!-- Layer labels -->
  <g class="lbl">
    <text x="40" y="132" fill="#1e3a8a">DIRECTING</text>
    <text x="40" y="150" class="m s" font-weight="400">Project board</text>
    <text x="40" y="262" fill="#0f766e">MANAGING</text>
    <text x="40" y="280" class="m s" font-weight="400">Project manager</text>
    <text x="40" y="462" fill="#c2410c">DELIVERING</text>
    <text x="40" y="480" class="m s" font-weight="400">AI-DLC: humans</text>
    <text x="40" y="496" class="m s" font-weight="400">+ agents</text>
  </g>

  <!-- Directing band -->
  <rect x="190" y="105" width="970" height="62" rx="10" fill="#1e3a8a"/>
  <text x="210" y="133" class="w h2">Project board: Executive · Senior user · Senior supplier</text>
  <text x="210" y="155" class="w s" opacity=".9">Authorises initiation, each stage, exception plans and closure · sets stage tolerances · owns the business case</text>

  <!-- Managing band: management stages -->
  <g>
    <rect x="190" y="215" width="210" height="110" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="205" y="242" class="t h2">Initiation stage</text>
    <text x="205" y="264" class="m s">Project brief → PID</text>
    <text x="205" y="282" class="m s">Business case · approaches</text>
    <text x="205" y="300" class="m s">Tolerances · tailoring</text>

    <rect x="420" y="215" width="270" height="110" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="435" y="242" class="t h2">Delivery stage 2</text>
    <text x="435" y="264" class="m s">Stage plan · work packages</text>
    <text x="435" y="282" class="m s">Highlight reports to the board</text>
    <text x="435" y="300" class="m s">Project log kept current</text>

    <rect x="710" y="215" width="270" height="110" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="725" y="242" class="t h2">Delivery stage 3</text>
    <text x="725" y="264" class="m s">Stage plan · work packages</text>
    <text x="725" y="282" class="m s">Exception report if a breach</text>
    <text x="725" y="300" class="m s">is forecast</text>

    <rect x="1000" y="215" width="160" height="110" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="1015" y="242" class="t h2">Closing</text>
    <text x="1015" y="264" class="m s">Acceptance</text>
    <text x="1015" y="282" class="m s">Handover</text>
    <text x="1015" y="300" class="m s">End project report</text>
  </g>

  <!-- Stage-boundary gates -->
  <g>
    <line x1="410" y1="167" x2="410" y2="215" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="700" y1="167" x2="700" y2="215" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="990" y1="167" x2="990" y2="215" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M410,178 l13,13 -13,13 -13,-13z" fill="#fbbf24" stroke="#1e3a8a" stroke-width="1.5"/>
    <path d="M700,178 l13,13 -13,13 -13,-13z" fill="#fbbf24" stroke="#1e3a8a" stroke-width="1.5"/>
    <path d="M990,178 l13,13 -13,13 -13,-13z" fill="#fbbf24" stroke="#1e3a8a" stroke-width="1.5"/>
  </g>
  <text x="430" y="197" class="t s" font-weight="600">◆ stage boundary = board go / no-go</text>

  <!-- Delegation arrows between managing and delivering -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="280" y1="330" x2="280" y2="398" marker-end="url(#ah)"/>
    <line x1="320" y1="398" x2="320" y2="330" marker-end="url(#ah)"/>
    <line x1="535" y1="330" x2="535" y2="398" marker-end="url(#ah)"/>
    <line x1="575" y1="398" x2="575" y2="330" marker-end="url(#ah)"/>
    <line x1="825" y1="330" x2="825" y2="398" marker-end="url(#ah)"/>
    <line x1="865" y1="398" x2="865" y2="330" marker-end="url(#ah)"/>
    <line x1="1060" y1="330" x2="1060" y2="398" marker-end="url(#ah)"/>
    <line x1="1100" y1="398" x2="1100" y2="330" marker-end="url(#ah)"/>
  </g>
  <rect x="600" y="347" width="210" height="34" rx="6" fill="#f8fafc"/>
  <text x="605" y="361" class="t s" font-weight="600">↓ work package + tolerances</text>
  <text x="605" y="377" class="m s">time · cost · scope · quality</text>
  <rect x="890" y="347" width="160" height="34" rx="6" fill="#f8fafc"/>
  <text x="895" y="361" class="t s" font-weight="600">↑ checkpoint report</text>
  <text x="895" y="377" class="m s">issues · forecast breach</text>
  <rect x="340" y="347" width="170" height="34" rx="6" fill="#f8fafc"/>
  <text x="345" y="361" class="t s" font-weight="600">↓ intent = mandate</text>
  <text x="345" y="377" class="m s">↑ units, specs, plan</text>

  <!-- Delivering band: AI-DLC -->
  <g>
    <rect x="190" y="405" width="210" height="160" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text x="205" y="432" class="t h2">Inception</text>
    <text x="205" y="455" class="m s">Mob Elaboration:</text>
    <text x="205" y="472" class="m s">AI asks, team answers</text>
    <text x="205" y="494" class="m s">Requirements · stories</text>
    <text x="205" y="511" class="m s">Units of work</text>
    <text x="205" y="528" class="m s">(= product breakdown)</text>

    <rect x="420" y="405" width="560" height="160" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text x="435" y="432" class="t h2">Construction: one unit at a time</text>
    <text x="435" y="455" class="m s">Mob Construction validates the design → agents generate code and tests → CI and evals</text>

    <!-- units -->
    <g font-size="13" font-weight="600">
      <rect x="435" y="470" width="58" height="34" rx="6" fill="#fff" stroke="#c2410c"/><text x="452" y="492" fill="#9a3412">U-A</text>
      <rect x="501" y="470" width="58" height="34" rx="6" fill="#fff" stroke="#c2410c"/><text x="518" y="492" fill="#9a3412">U-B</text>
      <rect x="567" y="470" width="58" height="34" rx="6" fill="#fff" stroke="#c2410c"/><text x="584" y="492" fill="#9a3412">U-C</text>
      <rect x="633" y="470" width="45" height="34" rx="6" fill="#fff" stroke="#c2410c"/><text x="642" y="492" fill="#9a3412">U-D</text>
      <rect x="725" y="470" width="68" height="34" rx="6" fill="#fff" stroke="#c2410c"/><text x="747" y="492" fill="#9a3412">U-E</text>
      <rect x="801" y="470" width="68" height="34" rx="6" fill="#fff" stroke="#c2410c"/><text x="823" y="492" fill="#9a3412">U-F</text>
      <rect x="877" y="470" width="88" height="34" rx="6" fill="#fff" stroke="#c2410c" stroke-dasharray="4 3"/><text x="887" y="492" fill="#9a3412">U-G could</text>
    </g>
    <line x1="700" y1="465" x2="700" y2="535" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- bolts -->
    <g font-size="18" fill="#b45309" text-anchor="middle">
      <text x="464" y="526">↻</text><text x="530" y="526">↻</text><text x="596" y="526">↻</text>
      <text x="759" y="526">↻</text><text x="835" y="526">↻</text>
    </g>
    <text x="435" y="552" class="m s">↻ bolts: hours-to-days cycles inside work packages, not board-approved</text>

    <rect x="1000" y="405" width="160" height="160" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text x="1015" y="432" class="t h2">Operations</text>
    <text x="1015" y="455" class="m s">Deploy · monitor</text>
    <text x="1015" y="472" class="m s">Human oversight</text>
    <text x="1015" y="489" class="m s">of production</text>
    <text x="1015" y="511" class="m s">→ benefits reviews</text>
    <text x="1015" y="528" class="m s">by senior user</text>
  </g>

  <!-- Records -->
  <rect x="190" y="600" width="440" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="205" y="626" class="t h2">PRINCE2 project log</text>
  <text x="205" y="648" class="m s">Daily · lessons logs · issue · risk · quality · product registers</text>
  <text x="205" y="666" class="m s">Validated in CI by prince2_check.py (exit 2 = exception)</text>

  <rect x="720" y="600" width="440" height="78" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="735" y="626" class="t h2">AI-DLC records</text>
  <text x="735" y="648" class="m s">Workflow state · audit trail · team knowledge and memory</text>
  <text x="735" y="666" class="m s">Linked from the log, not copied into it</text>

  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="636" y1="632" x2="714" y2="632" marker-end="url(#ah)"/>
    <line x1="714" y1="648" x2="636" y2="648" marker-end="url(#ah)"/>
  </g>
  <text x="675" y="625" text-anchor="middle" class="m s">link</text>
  <text x="675" y="668" text-anchor="middle" class="m s">lessons</text>

  <!-- Footer rule -->
  <rect x="40" y="712" width="1120" height="58" rx="10" fill="#0f172a"/>
  <text x="60" y="747" class="w h2">AI proposes · humans decide</text>
  <text x="330" y="738" fill="#cbd5e1" class="s">Agents draft products and execute work packages. Named humans approve the PID, stages, changes and</text>
  <text x="330" y="756" fill="#cbd5e1" class="s">acceptance. A forecast tolerance breach stops the agent and escalates one level up: TM → PM → board.</text>
</svg>
