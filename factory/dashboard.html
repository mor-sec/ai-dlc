<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --pass: #2f8f5b; --changes: #c8432f; --pending: #b9b9b2; --human: #d98a00; --human-bg: #fff6e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecece8; --muted: #9a9a93; --line: #33332f;
      --pass: #4fbf82; --changes: #ef6a55; --pending: #55554f; --human: #f0a72a; --human-bg: #2b2414;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 24px 8px; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: var(--muted); font-size: 12px; }
  main { padding: 8px 24px 24px; }
  .lane-human { border: 1.5px solid var(--human); background: var(--human-bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }
  .lane-human:empty { display: none; }
  .lane-human h2 { color: var(--human); }
  .lane-human .cards { display: flex; flex-wrap: wrap; gap: 10px; }
  .lane-human .card { width: 260px; border-color: var(--human); }
  .board { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { min-width: 180px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .col .cards { display: flex; flex-direction: column; gap: 10px; min-height: 60px; border-top: 2px solid var(--line); padding-top: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; }
  .card:hover, .card:focus-visible { border-color: var(--ink); outline: none; }
  .card .id { font: 600 12px ui-monospace, monospace; }
  .card .title { margin: 2px 0 6px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .card .note { color: var(--human); font-size: 12px; margin-top: 6px; }
  .rounds { margin-top: 8px; display: grid; gap: 4px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .n { font: 11px ui-monospace, monospace; color: var(--muted); width: 22px; }
  .chip { font-size: 10px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--pending); color: var(--muted); }
  .chip.PASS { background: var(--pass); border-color: var(--pass); color: #fff; }
  .chip.CHANGES { background: var(--changes); border-color: var(--changes); color: #fff; }
  .chip.pending { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .chip.pending { animation: none; } }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  aside { position: fixed; inset: 0 0 0 auto; width: min(720px, 100vw); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); visibility: hidden; transition: transform .2s, visibility .2s; display: flex; flex-direction: column; }
  aside.open { transform: none; visibility: visible; box-shadow: -8px 0 24px rgb(0 0 0 / .12); }
  aside header { border-bottom: 1px solid var(--line); padding: 16px 20px; justify-content: space-between; }
  aside button { background: none; border: 1px solid var(--line); color: inherit; border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; }
  #files { overflow-y: auto; padding: 0 20px 20px; }
  #files h3 { font: 600 12px ui-monospace, monospace; margin: 20px 0 6px; color: var(--muted); }
  #files pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: 12.5px/1.5 ui-monospace, monospace; background: var(--bg); padding: 12px; border-radius: 6px; }
  .v-PASS, .v-APPROVE { color: var(--pass); font-weight: 700; }
  .v-CHANGES, .v-ESCALATE { color: var(--changes); font-weight: 700; }
  @media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header><h1>Software Factory</h1><span id="status">loading…</span></header>
<main>
  <section class="lane-human" id="human"></section>
  <div class="board" id="board"></div>
</main>
<aside id="panel" aria-label="Job files">
  <header><h1 id="panel-title"></h1><button id="close">Close</button></header>
  <div id="files"></div>
</aside>
<script>
const STAGES = [["spec", "Spec"], ["build", "Build"], ["review", "Review"], ["approve", "Approve"], ["merged", "Merged"]];
const REVIEWERS = ["security", "ux", "ui", "code"];
const LABEL = { security: "sec", ux: "ux", ui: "ui", code: "code", human: "human" };
let lastText = "", jobs = [], openId = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function roundsOf(job) {
  const rows = (job.history || []).slice();
  // the live round shows once reviews have started; during a rebuild its chips would all be pending
  if (job.round > 0 && job.stage !== "spec" && job.stage !== "build") rows.push(job.reviews || {});
  return rows;
}

function card(job) {
  const rows = roundsOf(job).map((r, i) => `<div class="round"><span class="n">R${i + 1}</span>${
    [...REVIEWERS, ...("human" in r ? ["human"] : [])].map(k => {
      const v = r[k] || "pending";
      return `<span class="chip ${esc(v)}" title="${esc(k)}: ${esc(v)}">${LABEL[k]}</span>`;
    }).join("")}</div>`).join("");
  return `<button class="card" data-id="${esc(job.id)}">
    <div class="id">${esc(job.id)}</div>
    <div class="title">${esc(job.title || "")}</div>
    <div class="meta">${esc(job.branch || "")}${job.round ? ` · round ${job.round}` : ""}</div>
    ${rows ? `<div class="rounds">${rows}</div>` : ""}
    ${job.note ? `<div class="note">${esc(job.note)}</div>` : ""}
  </button>`;
}

function render() {
  const human = jobs.filter(j => j.stage === "needs-human");
  document.getElementById("human").innerHTML = human.length
    ? `<h2>Needs human · /factory approve or /factory rework</h2><div class="cards">${human.map(card).join("")}</div>` : "";
  document.getElementById("board").innerHTML = jobs.length
    ? STAGES.map(([key, name]) => `<div class="col"><h2>${name}</h2><div class="cards">${
        jobs.filter(j => j.stage === key).map(card).join("")}</div></div>`).join("")
    : `<div class="empty" style="grid-column: 1 / -1">No jobs yet. Run <code>/factory next</code>.</div>`;
}

async function poll() {
  const status = document.getElementById("status");
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    status.textContent = "updated " + new Date().toLocaleTimeString();
    if (text === lastText) return;
    lastText = text;
    jobs = JSON.parse(text).jobs || [];
    render();
    if (openId) showFiles(openId);
  } catch (e) {
    status.textContent = "can't read board.json: serve this folder with `python3 -m http.server`";
  }
}

async function showFiles(id) {
  const job = jobs.find(j => j.id === id);
  if (!job) return;
  const base = `jobs/${encodeURIComponent(id)}/`;
  const paths = ["spec.md", "build.md"];
  for (let n = 1; n <= (job.round || 0); n++)
    for (const r of [...REVIEWERS, "human"]) paths.push(`round-${n}/review-${r}.md`);
  paths.push("decision.md");
  const found = await Promise.all(paths.map(async p => {
    const res = await fetch(base + p, { cache: "no-store" }).catch(() => null);
    return res && res.ok ? [p, await res.text()] : null;
  }));
  if (openId !== id) return;
  document.getElementById("panel-title").textContent = id;
  document.getElementById("files").innerHTML = found.filter(Boolean).map(([p, text]) => {
    const [first, ...rest] = text.split("\n");
    const v = (first.match(/^(?:VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\b/) || [])[1];
    const head = v ? `<span class="v-${v}">${esc(first)}</span>` : esc(first);
    return `<h3>${esc(p)}</h3><pre>${head}\n${esc(rest.join("\n"))}</pre>`;
  }).join("") || "<p>No files yet.</p>";
}

document.addEventListener("click", e => {
  const c = e.target.closest(".card");
  if (c) { openId = c.dataset.id; document.getElementById("panel").classList.add("open"); showFiles(openId); }
});
const close = () => { openId = null; document.getElementById("panel").classList.remove("open"); };
document.getElementById("close").onclick = close;
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
