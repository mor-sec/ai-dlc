# markdownlint configuration for the AI-DLC Playbook.
# Rationale: standards/markdown-style-guide.md. Disabled rules are deliberate, not accidental.
config:
  default: true
  MD013: false   # line length — prose is wrapped by the editor, not by hand
  MD060: false   # table column style — compact |---| separators are the house style
  MD033: false   # inline HTML — Mermaid node labels need <br/>
ignores:
  - node_modules
  - .claude/worktrees           # factory build worktrees: copies of the repo
  - factory/jobs                # factory records open with a VERDICT line, not an H1 (MD041)
  - .github/pull_request_template.md   # PR templates have no H1 by convention (MD041)
